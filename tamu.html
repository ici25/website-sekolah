<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Tamu - Tenaga Pendidik</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8F7F4] font-sans antialiased p-6 md:p-12">

    <div class="max-w-6xl mx-auto">
        <!-- Header Section -->
        <div class="mb-8">
            <span class="text-emerald-700 font-bold text-sm tracking-wider uppercase">Tenaga Pendidik</span>
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mt-1">Guru-guru</h1>
        </div>

        <!-- Container Kartu Guru Dinamis dari Database -->
        <div id="teacher-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading State awal -->
            <p class="text-gray-500 col-span-full">Memuat data guru dari database...</p>
        </div>
    </div>

    <script>
        // Fungsi untuk mengambil data guru dari database via PHP
        async function fetchTeachersFromDatabase() {
            const container = document.getElementById('teacher-container');
            try {
                const response = await fetch('get_guru.php');
                
                if (!response.ok) {
                    throw new Error('Gagal terhubung ke server database.');
                }

                const teacherData = await response.json();
                container.innerHTML = ''; // Bersihkan loading

                if (teacherData.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 col-span-full">Belum ada data guru yang dimasukkan ke dalam database.</p>';
                    return;
                }

                // Render setiap data guru ke dalam kartu HTML
                teacherData.forEach(teacher => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between transition hover:shadow-md";

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <!-- Foto Guru -->
                                <div class="w-16 h-16 rounded-xl overflow-hidden bg-sky-50 border border-sky-100 flex items-center justify-center">
                                    <img src="${teacher.photo}" alt="${teacher.name}" class="w-full h-full object-cover">
                                </div>
                                <span class="text-xs font-semibold px-2.5 py-1 bg-sky-100 text-sky-800 rounded-lg">${teacher.id}</span>
                            </div>
                            <h3 class="text-lg font-bold text-gray-900 mb-1">${teacher.name}</h3>
                            <p class="text-sm text-gray-500">${teacher.title}</p>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<p class="text-red-500 col-span-full">Terjadi kesalahan saat memuat data guru: ${error.message}</p>`;
            }
        }

        // Jalankan fungsi saat halaman selesai dimuat
        document.addEventListener('DOMContentLoaded', fetchTeachersFromDatabase);
    </script>

</body>
</html>
